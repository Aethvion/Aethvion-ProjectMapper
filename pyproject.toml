[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethvion-project-mapper"
version = "1.5.1"
description = "Static code analysis + knowledge-graph for AI coding agents — 10 languages, cut token costs by 83–92 %"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Aethvion", email = "contact@aethvion.com" },
]
keywords = [
    "mcp", "mcp-server", "ai-agents", "code-analysis", "knowledge-graph",
    "claude", "claude-code", "cursor", "antigravity", "project-mapper",
    "static-analysis", "codebase-indexing", "llm-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
# Language-specific tree-sitter parsers — install only the ones you need.
# All are optional; the analyzer falls back to a stub if not installed.
typescript = [
    "tree-sitter>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
]
java = [
    "tree-sitter>=0.23.0",
    "tree-sitter-java>=0.23.0",
]
go = [
    "tree-sitter>=0.23.0",
    "tree-sitter-go>=0.23.0",
]
csharp = [
    "tree-sitter>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
]
rust = [
    "tree-sitter>=0.23.0",
    "tree-sitter-rust>=0.23.0",
]
c = [
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
]
cpp = [
    "tree-sitter>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
]
php = [
    "tree-sitter>=0.23.0",
    "tree-sitter-php>=0.23.0",
]
ruby = [
    "tree-sitter>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
]
kotlin = [
    "tree-sitter>=0.23.0",
    "tree-sitter-kotlin>=0.23.0",
]
swift = [
    "tree-sitter>=0.23.0",
    "tree-sitter-swift>=0.5.0",
]
# Install all tree-sitter parsers at once
languages = [
    "tree-sitter>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-kotlin>=0.23.0",
    "tree-sitter-swift>=0.5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
pm-server = "project_mapper.app:serve"
pm-mcp    = "project_mapper.mcp_server:main"

[project.urls]
Homepage      = "https://aethvion.com/projectmapper.html"
Repository    = "https://github.com/Aethvion/Aethvion-ProjectMapper"
Documentation = "https://github.com/Aethvion/Aethvion-ProjectMapper/tree/main/docs"
Issues        = "https://github.com/Aethvion/Aethvion-ProjectMapper/issues"
Changelog     = "https://github.com/Aethvion/Aethvion-ProjectMapper/releases"

[tool.setuptools.packages.find]
include = ["project_mapper*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
