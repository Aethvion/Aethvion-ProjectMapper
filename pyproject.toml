[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aethvion-project-mapper"
version = "1.0.0"
description = "Static code analysis + knowledge-graph tool for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
keywords = [
    "mcp", "ai-agents", "code-analysis", "knowledge-graph",
    "claude", "cursor", "project-mapper",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
pm-server  = "server:app"
pm-mcp     = "project_mapper.mcp_server:main"

[project.urls]
Homepage   = "https://github.com/Aethvion/Aethvion-ProjectMapper"
Repository = "https://github.com/Aethvion/Aethvion-ProjectMapper"
Issues     = "https://github.com/Aethvion/Aethvion-ProjectMapper/issues"

[tool.setuptools.packages.find]
include = ["project_mapper*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
